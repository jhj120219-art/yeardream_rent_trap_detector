name: Backend MySQL integration

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'analyze.py'
      - 'compare_rent.py'
      - 'normalize_listing.py'
      - 'test_normalize.py'
      - 'contract/**'
      - 'integration_kit_v1.1/**'
      - '.github/workflows/backend-mysql.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'analyze.py'
      - 'compare_rent.py'
      - 'normalize_listing.py'
      - 'test_normalize.py'
      - 'contract/**'
      - 'integration_kit_v1.1/**'
      - '.github/workflows/backend-mysql.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mysql: ['8.0', '8.4']
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_DATABASE: rent_test
          MYSQL_USER: rent_test
          # Disposable CI-only credentials; no production secrets used.
          MYSQL_PASSWORD: ci_only_app_password
          MYSQL_ROOT_PASSWORD: ci_only_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30
    env:
      MYSQL_TEST_DATABASE_URL: mysql+pymysql://rent_test:ci_only_app_password@127.0.0.1:3306/rent_test
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Run regression and real MySQL tests (required)
        run: python -m pytest backend/tests -q --require-mysql --junitxml=backend/data/ci-results.xml
      - name: Reject skipped integration checks
        run: >-
          python -c "import xml.etree.ElementTree as ET; suites = ET.parse('backend/data/ci-results.xml').getroot().iter('testsuite'); assert sum(int(s.get('skipped', '0')) for s in suites) == 0, 'CI must run every integration check'"
